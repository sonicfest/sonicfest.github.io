        padding: 15px 30px;
        border-radius: 25px;
        font-weight: bold;
        font-size: 1.2rem;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        transition: transform 0.2s ease, background 0.2s ease;
        margin: 20px 0 40px 0;
      }

      a.button:hover {
        background-color: #ffd633;
