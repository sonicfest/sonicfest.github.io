<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-29W3Y5CDRT"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-29W3Y5CDRT');
    </script>
    
    <title>SONIC FEST - TIENDA Y MERCHANDISING OFICIAL COMPRAR</title>
    
    <meta name="description" content="Merchandising oficial de Sonic Fest Argentina. Remeras, capas, pines y más productos exclusivos para fans de Sonic.">
    
    <link rel="stylesheet" href="css/main.css">

    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">

    <style>
        .donation-container {
            background: linear-gradient(135deg, #0056b3 0%, #002d5c 100%);
            border: 3px solid #ffcc00;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            margin: 60px auto;
            max-width: 600px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            font-family: 'Righteous', sans-serif;
        }

        .donation-title {
            color: #fff;
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .donation-text {
            color: #ffcc00;
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        .btn-donate {
            display: inline-block;
            background-color: #00c853;
            color: white;
            padding: 15px 35px;
            font-size: 1.3rem;
            text-decoration: none;
            border-radius: 50px;
            transition: transform 0.2s, background-color 0.2s;
            border: 2px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .btn-donate:hover {
            background-color: #00e676;
            transform: scale(1.05);
            color: #000;
        }

        .heart-icon {
            color: #ff4444;
            display: block;
            font-size: 2rem;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <div id="header-placeholder"></div>

    <div class="header-title" style="margin-top: 110px;">
        TIENDA SONIC FEST
    </div>

    <p class="description">
        MERCHANDISING EXCLUSIVO DE NUESTROS EVENTOS.<br>
        CONTACTANOS POR INSTAGRAM PARA PREVENTA O COMPRÁ EN VIVO.
    </p>

    <div class="header-title" style="font-size: 1.5rem; color: #ffcc00;">REMERAS: $30K</div>
    <div class="gallery-grid" style="margin-bottom: 40px;">
        <img src="Images/diseño de las remeras A.png" alt="Remera Sonic Fest" class="gallery-image">
        <img src="Images/diseño de las remeras B.png" alt="Sonic Fest Remera" class="gallery-image">
        <img src="Images/diseño de las remeras N.png" alt="Sonic Fest comprar Remera" class="gallery-image">
    </div>

    <div class="header-title" style="font-size: 1.5rem; color: #ffcc00;">LA CAPA DE SONIC FEST: $30K</div>
    <div class="gallery-grid" style="margin-bottom: 40px;">
        <img src="Images/capa.png" alt="Capa Sonic Fest" class="gallery-image">
        <img src="Images/CAPA1.png" alt="Sonic Fest Capa" class="gallery-image">
        <img src="Images/CAPA2.png" alt="Johnny Gioeli Capa" class="gallery-image">
        <img src="Images/CAPA3.png" alt="Sonic Fest Merch" class="gallery-image">
    </div>

    <div class="header-title" style="font-size: 1.5rem; color: #ffcc00;">PINES Y LLAVEROS: $1K</div>
    <div class="gallery-grid" style="margin-bottom: 40px;">
        <img src="Images/pin de regalo.png" alt="Pin Sonic Fest" class="gallery-image">
        <img src="Images/png del pin.png" alt="Sonic Fest pin" class="gallery-image">
        <img src="Images/llavero.png" alt="Llavero Sonic Fest" class="gallery-image">
        <img src="Images/llavero2.png" alt="Sonic Fest Llavero" class="gallery-image">
    </div>

    <div class="header-title" style="font-size: 1.5rem; color: #ffcc00;">TAZAS: 1 X $8K, 2 X $15K</div>
    <div class="gallery-grid" style="margin-bottom: 40px;">
        <img src="Images/TAZAS.png" alt="Tazas Sonic Fest" class="gallery-image" style="grid-column: span 2; max-width: 500px; margin: auto;">
    </div>

    <div class="header-title" style="font-size: 1.5rem; color: #ffcc00;">CHAOS COLA: PRÓXIMAMENTE</div>
    <div class="gallery-grid" style="margin-bottom: 40px;">
        <img src="Images/chaos cola.png" alt="Chaos Cola" class="gallery-image" style="max-width: 300px; margin: auto;">
    </div>


    <a class="button" href="https://sonicfest.com.ar" style="display:block; max-width:400px; margin:50px auto;">
        ← VOLVER A PÁGINA PRINCIPAL
    </a>

    <div id="footer-placeholder"></div>

    <script src="js/main.js"></script>
</body>
</html>
